[project]
name = "agentic-knowledge-triage"
version = "1.0.0"
description = "OWASP 공개 문서 기반 RAG + tool calling 보안 Q&A 에이전트 (Iyuno AI Agent Engineer 공고 대응 포트폴리오)"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# ruff 기본 규칙이 버전마다 바뀌므로 검사할 규칙을 명시한다.
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]
